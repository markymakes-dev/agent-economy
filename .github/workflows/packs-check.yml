# Weekly drift check: curated install specs must still exist in upstream HEAD.
# Upstream renames break `ae packs --install` silently — this catches it early.
name: packs-check
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node src/cli.js packs --check
