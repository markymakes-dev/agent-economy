# Publishes to npm via OIDC trusted publishing — no NODE_AUTH_TOKEN secret involved.
# One-time setup: npmjs.com → agent-economy → Settings → Trusted Publisher →
#   GitHub: markymakes-dev/agent-economy · workflow: release.yml
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # registry-url is REQUIRED: setup-node performs the OIDC exchange and
      # injects the short-lived npm token itself (run 43737084234 proved the
      # PUT was authenticated — npm's 404 there was an authorization refusal,
      # i.e. npm-side trusted-publisher config, not this workflow).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm test
      - run: npm publish --provenance
      - name: dump npm debug log (404 forensics)
        if: failure()
        run: tail -n 100 "$(ls -t $HOME/.npm/_logs/*-debug-0.log | head -1)" || true
