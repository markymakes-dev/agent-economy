# Publishes to npm via OIDC trusted publishing — no NODE_AUTH_TOKEN secret involved.
# One-time setup: npmjs.com → agent-economy → Settings → Trusted Publisher →
#   GitHub: markymakes-dev/agent-economy · workflow: release.yml
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No registry-url: setup-node would write an .npmrc interpolating
      # NODE_AUTH_TOKEN, and that (limited) token then overrides OIDC auth —
      # npm authenticated as it and soft-404'd the PUT.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g npm@latest # OIDC trusted publishing needs npm >= 11.5.1
      - run: npm test
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ""
