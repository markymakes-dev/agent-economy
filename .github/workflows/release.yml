# Publishes to npm via OIDC trusted publishing — no NODE_AUTH_TOKEN secret involved.
# One-time setup: npmjs.com → agent-economy → Settings → Trusted Publisher →
#   GitHub: markymakes-dev/agent-economy · workflow: release.yml
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # npm >=11.5 ships OIDC trusted publishing
          registry-url: https://registry.npmjs.org
      - run: npm test
      - run: npm publish --provenance
