<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-economy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #FFFFFF;
    --side: #F8FAFC;
    --inset: #F1F5F9;
    --card: #FFFFFF;
    --border: #E2E8F0;
    --border-strong: #CBD5E1;
    --ink: #0F172A;
    --muted: #475569;
    --faint: #64748B;
    --accent: #0F766E;
    --accent-ink: #FFFFFF;
    --accent-soft: #F0FDFA;
    --ok-bg: #ECFDF5;   --ok-ink: #047857;  --ok-ring: #05966940;
    --warn-bg: #FFFBEB; --warn-ink: #B45309; --warn-ring: #D9770640;
    --bad-bg: #FEF2F2;  --bad-ink: #B91C1C;  --bad-ring: #DC262640;
    --focus: #0F766E;
  }
  [data-theme="dark"] {
    --page: #0F172A;
    --side: #0B1220;
    --inset: #1E293B;
    --card: #16202F;
    --border: #334155;
    --border-strong: #475569;
    --ink: #F1F5F9;
    --muted: #A6B4C8;
    --faint: #8CA0B8;
    --accent: #5EEAD4;
    --accent-ink: #0F172A;
    --accent-soft: #113B36;
    --ok-bg: #0B332A;   --ok-ink: #6EE7B7;  --ok-ring: #10B98155;
    --warn-bg: #3B2A0E; --warn-ink: #FCD34D; --warn-ring: #F59E0B55;
    --bad-bg: #3F1A1A;  --bad-ink: #FCA5A5;  --bad-ring: #EF444455;
    --focus: #5EEAD4;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 400 13px/1.55 Inter, system-ui, sans-serif;
    color: var(--ink);
    background: var(--page);
    -webkit-font-smoothing: antialiased;
  }
  .shell {
    display: grid;
    grid-template-columns: 15rem 1fr;
    grid-template-rows: 3.5rem 1fr;
    height: 100dvh;
  }
  /* ---------- sidebar ---------- */
  .side {
    grid-row: 1 / 3;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    padding: 1rem 0.875rem;
    background: var(--side);
    border-right: 1px solid var(--border);
    overflow-y: auto;
  }
  .wordmark {
    font-family: "Bricolage Grotesque", Inter, system-ui, sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: -0.01em;
    color: var(--ink);
    padding: 0.25rem 0.5rem 0;
  }
  .wordmark span { color: var(--accent); }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-item {
    appearance: none;
    border: 0;
    background: transparent;
    font: inherit;
    font-weight: 500;
    color: var(--muted);
    text-align: left;
    padding: 0.4rem 0.5rem;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 150ms ease, color 150ms ease;
  }
  .nav-item:hover { background: var(--inset); color: var(--ink); }
  .nav-item.is-active { background: var(--accent-soft); color: var(--accent); }
  [data-theme="dark"] .nav-item.is-active { color: var(--accent); }
  .side-foot {
    margin: auto 0.5rem 0.25rem;
    font-size: 12px;
    color: var(--faint);
    border-top: 1px solid var(--border);
    padding-top: 0.75rem;
  }
  /* ---------- header ---------- */
  .top {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0 1.5rem;
    border-bottom: 1px solid var(--border);
    background: var(--page);
  }
  .top h1 {
    margin: 0;
    font-family: "Bricolage Grotesque", Inter, system-ui, sans-serif;
    font-weight: 600;
    font-size: 18px;
    letter-spacing: -0.01em;
  }
  .sub {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
    flex: 1;
    min-width: 0;
  }
  /* ---------- main ---------- */
  main {
    overflow-y: auto;
    padding: 1.25rem 1.5rem 3rem;
  }
  .view { max-width: 64rem; }
  .group { margin: 0 0 1.75rem; }
  .group > h2 {
    margin: 0 0 0.5rem;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
  }
  .note { color: var(--faint); font-size: 12px; margin: 0.35rem 0 0; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  /* ---------- status rows (health) ---------- */
  .stat-row {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0.75rem;
    padding: 0.875rem 1rem;
  }
  .stat-row + .stat-row { border-top: 1px solid var(--border); }
  .stat-name { font-weight: 500; min-width: 9.5rem; }
  .stat-detail { color: var(--muted); flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .stat-fix { flex-basis: 100%; display: flex; align-items: center; gap: 0.5rem; padding-top: 0.15rem; }
  /* ---------- tables ---------- */
  .table-wrap { overflow-x: auto; border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    position: sticky; top: 0;
    text-align: left;
    font-weight: 500;
    font-size: 12px;
    color: var(--muted);
    background: var(--inset);
    padding: 0.5rem 1rem;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody td { padding: 0.6rem 1rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr { transition: background-color 150ms ease; }
  tbody tr:hover { background: var(--accent-soft); }
  [data-theme="dark"] tbody tr:hover { background: #14283c; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .cmds { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; }
  /* ---------- chips / buttons ---------- */
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    border-radius: 6px;
    padding: 0.1rem 0.5rem;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
  }
  .chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .chip.ok   { background: var(--ok-bg);   color: var(--ok-ink); }
  .chip.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .chip.bad  { background: var(--bad-bg);  color: var(--bad-ink); }
  .chip.wait { background: var(--inset);   color: var(--muted); }
  .btn {
    appearance: none;
    font: inherit;
    font-weight: 500;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 0.3rem 0.7rem;
    cursor: pointer;
    transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease;
  }
  .btn:hover { background: var(--inset); }
  .btn.small { padding: 0.15rem 0.5rem; font-size: 12px; }
  .btn[disabled] { cursor: default; color: var(--muted); }
  :is(.btn, .nav-item, .copy):focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
  .cmdline {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--inset);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.2rem 0.2rem 0.2rem 0.55rem;
    min-width: 0;
  }
  .cmdline code {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: 12px;
    overflow-wrap: anywhere;
    white-space: normal;
  }
  /* ---------- states ---------- */
  .skeleton { border-radius: 6px; height: 0.9rem; background: var(--inset); }
  .skeleton-row { display: flex; gap: 1rem; padding: 0.875rem 1rem; }
  .skeleton-row .skeleton { flex: 1; }
  @media (prefers-reduced-motion: no-preference) {
    .skeleton { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.55; } }
    .view { animation: fade 200ms ease-out; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } }
  }
  .errbox {
    border: 1px solid var(--border);
    border-left: 3px solid var(--bad-ink);
    border-radius: 8px;
    background: var(--card);
    padding: 0.875rem 1rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .empty {
    border: 1px dashed var(--border-strong);
    border-radius: 8px;
    padding: 1rem;
    color: var(--muted);
  }
  /* ---------- mobile ---------- */
  @media (max-width: 767px) {
    .shell { display: flex; flex-direction: column; }
    .side {
      flex-direction: row;
      align-items: center;
      gap: 0.75rem;
      padding: 0.5rem 0.75rem;
      border-right: 0;
      border-bottom: 1px solid var(--border);
      overflow: visible;
    }
    .nav { flex-direction: row; }
    .side-foot { display: none; }
    main { padding: 1rem; }
    .stat-name { min-width: 0; }
    .stat-row { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="wordmark">agent-<span>economy</span></div>
    <nav class="nav" aria-label="Sections">
      <button type="button" class="nav-item is-active" data-view="health" aria-current="page">Health</button>
      <button type="button" class="nav-item" data-view="inventory">Inventory</button>
      <button type="button" class="nav-item" data-view="packs">Packs</button>
    </nav>
    <p class="side-foot">Every model round-trip bills one request. Batch the independent ones.</p>
  </aside>
  <header class="top">
    <h1 id="view-title">Health</h1>
    <p class="sub" id="view-sub"></p>
    <button type="button" class="btn small" id="theme" aria-label="Switch to dark theme" aria-pressed="false">Dark</button>
  </header>
  <main id="main" tabindex="-1">
    <section class="view" id="view-health" role="tabpanel" aria-labelledby="view-title"></section>
  </main>
</div>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const main = $("#main");

const SUBTITLES = {
  health: "Live status of the token-economy stack, plus setup checks for this machine.",
  inventory: "Plugins, MCP servers, commands and skills discovered across the agents on this machine.",
  packs: "Curated skill packs fetched on demand with pinned refs and attribution. Stack tools are detected, never installed."
};

/* ---------- tiny DOM helpers (no innerHTML — untrusted data stays text) ---------- */
function el(tag, attrs, ...children) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else n.setAttribute(k, v);
  }
  for (const c of children) if (c != null) n.append(c);
  return n;
}
const chip = (kind, text) => el("span", { class: `chip ${kind}`, text });
function copyCmd(text, label) {
  const wrap = el("span", { class: "cmdline" });
  const b = el("button", { class: "btn small", type: "button", "aria-label": `Copy command: ${label || text}` }, document.createTextNode("Copy"));
  b.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(text); } catch { /* clipboard unavailable — text stays selectable */ }
    b.textContent = "Copied";
    b.disabled = true;
    setTimeout(() => { b.textContent = "Copy"; b.disabled = false; }, 1200);
  });
  wrap.append(el("code", { text }), b);
  return wrap;
}
async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status} from ${url}`);
  return r.json();
}
const cache = new Map();
function load(key, url) {
  if (!cache.has(key)) cache.set(key, getJSON(url).catch((e) => { cache.delete(key); throw e; }));
  return cache.get(key);
}

/* ---------- shared fragments ---------- */
function skeletonRows(n, cols) {
  const rows = [];
  for (let i = 0; i < n; i++) {
    const r = el("div", { class: "skeleton-row", "aria-hidden": "true" });
    for (let c = 0; c < cols; c++) r.append(el("span", { class: "skeleton" }));
    rows.push(r);
  }
  return el("div", { class: "card" }, ...rows);
}
function errorBox(message, retry) {
  const b = el("button", { class: "btn small", type: "button", text: "Retry" });
  b.addEventListener("click", retry);
  return el("div", { class: "errbox", role: "alert" },
    el("span", { text: `Could not load data: ${message}` }), b);
}
function group(title, ...body) {
  return el("section", { class: "group" }, el("h2", { text: title }), ...body);
}

/* ---------- views ---------- */
async function renderHealth(mount, retry) {
  const [inv, doc] = await Promise.all([load("inventory", "/api/inventory"), load("doctor", "/api/doctor")]);
  const stackCard = el("div", { class: "card" });
  for (const s of inv.stack) {
    const row = el("div", { class: "stat-row" },
      el("span", { class: "stat-name", text: s.name }),
      el("span", { class: "stat-detail", text: s.detail }),
      chip(s.ok ? "ok" : "bad", s.ok ? "healthy" : "down"));
    if (s.hint) row.append(el("span", { class: "stat-fix" }, copyCmd(s.hint, s.name)));
    stackCard.append(row);
  }
  const checksTable = el("div", { class: "table-wrap card" },
    el("table", {},
      el("thead", {}, el("tr", {},
        el("th", { scope: "col", text: "Check" }),
        el("th", { scope: "col", text: "State" }),
        el("th", { scope: "col", text: "Remedy" }))),
      el("tbody", {},
        ...doc.map((r) => el("tr", {},
          el("td", { text: r.name }),
          el("td", {}, chip(r.ok ? "ok" : "warn", r.ok ? "present" : "missing")),
          el("td", {}, r.ok ? "—" : copyCmd(r.hint, r.name)))))));
  mount.replaceChildren(
    group("Token-economy stack", stackCard,
      el("p", { class: "note", text: "Live versions detected on this machine. ae never installs these — commands are here to copy." })),
    group("Setup checks", checksTable,
      el("p", { class: "note", text: "Files and tools the request-economy rules assume. Run the remedy to fix a missing row." })));
}
async function renderInventory(mount, retry) {
  const inv = await load("inventory", "/api/inventory");
  const orphans = inv.groups.flatMap((g) => g.entries).filter((e) => e.orphan).length;
  const parts = [];
  const summary = el("p", { class: "note", style: "margin:0 0 1.25rem" },
    `${inv.count} entries across ${inv.groups.length} sources` + (orphans ? ` — ${orphans} orphaned` : ""));
  summary.style.fontVariantNumeric = "tabular-nums";
  parts.push(summary);
  for (const g of inv.groups) {
    const tbody = el("tbody", {});
    for (const e of g.entries) {
      tbody.append(el("tr", {},
        el("td", { text: e.name }),
        el("td", {}, e.orphan ? chip("warn", "orphaned") : el("span", { text: "—" }))));
    }
    parts.push(group(g.source, el("div", { class: "table-wrap card" },
      el("table", {},
        el("thead", {}, el("tr", {},
          el("th", { scope: "col", text: "Name" }),
          el("th", { scope: "col", text: "Status" }))),
        tbody))));
  }
  mount.replaceChildren(...parts);
}
async function renderPacks(mount, retry) {
  const packs = await load("packs", "/api/packs");
  const tbody = el("tbody", {});
  for (const p of packs.curated) {
    const statusCell = el("td", {}, el("span", { class: "note", text: "not checked" }));
    const installCmd = `npx agent-economy packs --install ${p.id}`;
    const row = el("tr", {},
      el("td", { text: p.id }),
      el("td", { class: "cmds", text: p.source }),
      el("td", { class: "num", text: String(p.specs) }),
      statusCell,
      el("td", {}, copyCmd(installCmd, p.id)));
    tbody.append(row);
  }
  const curatedTable = el("div", { class: "table-wrap card" },
    el("table", {},
      el("thead", {}, el("tr", {},
        el("th", { scope: "col", text: "Pack" }),
        el("th", { scope: "col", text: "Source" }),
        el("th", { scope: "col", text: "Skills", class: "num" }),
        el("th", { scope: "col", text: "Upstream check" }),
        el("th", { scope: "col", text: "Install" }))),
      tbody));
  const toolsCard = el("div", { class: "card" });
  for (const t of packs.tools) {
    toolsCard.append(el("div", { class: "stat-row" },
      el("span", { class: "stat-name", text: t.id }),
      el("span", { class: "cmds", text: t.source }),
      el("span", { class: "stat-fix" }, copyCmd(t.setup, t.id))));
  }
  mount.replaceChildren(
    group("Curated packs", curatedTable,
      el("p", { class: "note", text: "Upstream check downloads the pack tarball and compares the pinned install specs against it — read-only, nothing is installed." })),
    group("Stack tools", toolsCard,
      el("p", { class: "note", text: "Runtime tools with a trust boundary (command rewriting, traffic proxying). Set them up yourself; ae only detects them." })));
  const checkOnce = {};
  for (const [i, p] of packs.curated.entries()) {
    const b = el("button", { class: "btn small", type: "button", text: "Verify specs" });
    const statusCell = tbody.children[i].children[3];
    statusCell.replaceChildren(b);
    b.addEventListener("click", async () => {
      b.disabled = true;
      statusCell.replaceChildren(chip("wait", "checking…"));
      try {
        if (!checkOnce[p.id]) checkOnce[p.id] = getJSON(`/api/packs/check?id=${encodeURIComponent(p.id)}`);
        const d = await checkOnce[p.id];
        const r = d.results && d.results[0];
        if (!r) throw new Error(d.error || "empty result");
        if (r.error) statusCell.replaceChildren(chip("bad", r.error));
        else if (r.missing.length) statusCell.replaceChildren(chip("bad", "drift"), el("div", { class: "note", text: `missing upstream: ${r.missing.join(", ")}` }));
        else statusCell.replaceChildren(chip("ok", `${r.total}/${r.total} specs`));
      } catch (e) {
        statusCell.replaceChildren(chip("bad", "check failed"), el("div", { class: "note", text: String(e.message || e) }));
        delete checkOnce[p.id];
        b.disabled = false;
      }
    });
  }
}

const RENDER = { health: renderHealth, inventory: renderInventory, packs: renderPacks };

async function show(view) {
  for (const b of document.querySelectorAll(".nav-item")) {
    const active = b.dataset.view === view;
    b.classList.toggle("is-active", active);
    if (active) b.setAttribute("aria-current", "page");
    else b.removeAttribute("aria-current");
  }
  $("#view-title").textContent = view[0].toUpperCase() + view.slice(1);
  $("#view-sub").textContent = SUBTITLES[view];
  const mount = el("div", {});
  $("#view-health").replaceWith(mount);
  mount.className = "view";
  mount.id = "view-health";
  mount.setAttribute("role", "tabpanel");
  mount.setAttribute("aria-labelledby", "view-title");
  const retry = () => show(view);
  mount.replaceChildren(skeletonRows(4, 3));
  try { await RENDER[view](mount, retry); }
  catch (e) { mount.replaceChildren(errorBox(String(e.message || e), retry)); }
}

/* ---------- nav + theme ---------- */
for (const b of document.querySelectorAll(".nav-item"))
  b.addEventListener("click", () => show(b.dataset.view));

const themeBtn = $("#theme");
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  themeBtn.textContent = t === "dark" ? "Light" : "Dark";
  themeBtn.setAttribute("aria-pressed", String(t === "dark"));
  themeBtn.setAttribute("aria-label", t === "dark" ? "Switch to light theme" : "Switch to dark theme");
}
themeBtn.addEventListener("click", () => {
  const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  localStorage.setItem("ae-theme", t);
  applyTheme(t);
});
applyTheme(localStorage.getItem("ae-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

const wanted = new URLSearchParams(location.search).get("view");
show(RENDER[wanted] ? wanted : "health");
</script>
</body>
</html>
